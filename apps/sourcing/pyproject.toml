[project]
name = "gd-sourcing"
version = "0.1.0"
description = "Downloads external design reference data (BoardGameGeek taxonomies) into data/."
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sourcing = "gd_sourcing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gd_sourcing"]
