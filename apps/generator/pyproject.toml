[project]
name = "gd-generator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["gd-gamecore", "gd-gauntlet", "gd-report", "gd-runner"]

[project.scripts]
generator = "gd_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gd_generator"]
